<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Gerador de Etiquetas</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

    html, body{
  width:100%;
}

body{
  font-family: Arial, sans-serif;

  background:#f3f4f6;

  margin:0;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding-top:40px;
}

.painel{

  background:white;

  padding:30px;

  width:650px;

  border:none;

  border-radius:18px;

  box-shadow:
    0 8px 24px rgba(0,0,0,0.10);

  margin-bottom:25px;
}

.painel h2{

  margin-top:0;

  text-align:center;

  font-size:30px;

  color:#2f8f89;

  margin-bottom:30px;
}

.campo{
  margin-top:10px;
}

button{

  margin-top:22px;

  padding:12px 20px;

  border:none;

  border-radius:10px;

  background:#2f8f89;

  color:white;

  font-weight:bold;

  font-size:14px;

  cursor:pointer;

  transition:0.2s;
}

button:hover{

  background:#267670;

  transform:translateY(-1px);
}

.erro{
  background:#ffe5e5;
  border:1px solid red;
  padding:10px;
  margin-top:10px;
  display:none;
}

.container{
  width:100%;

  display:flex;
  flex-direction:column;

  align-items:center;

  gap:12px;

  margin-top:4mm;
}

.etiqueta{
  width:130mm;

  background:white;

  box-sizing:border-box;

  overflow:visible;

  display:block;

  position:relative;

  outline:1px solid #000;

  outline-offset:-1px;
}

.label{
  width:120px;
  font-weight:bold;
  padding:5px;
  background:#f2f2f2;
}

.volume{

  font-size:20px;

  font-weight:bold;

  padding:10px;

  display:flex;

  justify-content:flex-end;

  align-items:center;

  gap:8px;

}

.volume .campo{
  width:auto;
}
.volume .valor{
  flex:none;
}
.volume .valor{
  font-size:18px;
}

@media print{

    *{
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

  @page{
    size:A4 portrait;
    margin:10mm;
  }

  body{
    background:white;
    margin:0;
    padding:0;
  }

  .painel{
    display:none;
  }

  .container{
  width:100%;

  display:flex;
flex-direction:column;

  grid-template-columns: 1fr;

  gap:12px;

  align-items:start;

  justify-items:center;

}

  .etiqueta{

  width:135mm;

  min-height:auto;

  break-inside: avoid;

  page-break-inside: avoid;

}

}

.etiqueta-box{
  width:100%;
  border:none;
  font-family:Arial, sans-serif;
  font-size:12px;
  background:#fff;
}

.titulo{

  text-align:center;

  font-weight:300;

  font-size:21px;

  padding:12px;

  border-bottom:0.7px solid #000;

  letter-spacing:1px;

}

.linha{
  display:flex;
  align-items:center;
  padding:0;
}

.campo{

  width:85px;

  font-weight:bold;

  padding:1px 3px;

  background:#fff;

}

.valor{

  flex:1;

  padding:1px 3px;

  font-size:12px;

  line-height:1.2;

}

.secao{
  border-top:0.7px solid #ccc;
  padding:2px 0;
}


.barcode{
  text-align:center;
  padding:7px;
  background:#fff;
}
.destaque .campo{
  font-size:14px;
}

.destaque .valor{
  font-size:16px;
  font-weight:bold;
  letter-spacing:1px;
}

</style>

</head>

<body>

<div class="painel">

<h2>Gerador de Etiquetas</h2>

<div class="campo">
Romaneio:
<input type="file" id="excelFile">
</div>

<div class="campo">
XMLs:
<input type="file" id="xmlFile" multiple>
</div>

<button onclick="gerarEtiqueta()">Gerar Etiquetas</button>
<button onclick="window.print()">Imprimir</button>

<div class="erro" id="erroBox"></div>

</div>

<div id="container" class="container"></div>

<script>

let mapaPedidos = {}
let lista = []

// ======================
// EXCEL
// ======================
document.getElementById("excelFile").addEventListener("change", function(e){

  const file = e.target.files[0]
  const reader = new FileReader()

reader.onload = function(ev){

  const data = new Uint8Array(ev.target.result)
  const workbook = XLSX.read(data, {type:"array"})

  let json = null
  let abaEncontrada = ""

  // ======================
// PROCURA ABA + LINHA DO CABEÇALHO
// ======================

let linhaCabecalho = -1

for(const nomeAba of workbook.SheetNames){

  const tentativaSheet = workbook.Sheets[nomeAba]

  const tentativaJson = XLSX.utils.sheet_to_json(tentativaSheet,{
    header:1,
    defval:""
  })

  if(tentativaJson.length === 0){
    continue
  }

  // percorre várias linhas procurando cabeçalho
  for(let l = 0; l < tentativaJson.length; l++){

    const linhaTexto = tentativaJson[l]
      .join(" ")
      .toLowerCase()

    const temPedido = linhaTexto.includes("pedido")

    const temNF =
      linhaTexto.includes("nf") ||
      linhaTexto.includes("nota")

    if(temPedido && temNF){

      json = tentativaJson
      abaEncontrada = nomeAba
      linhaCabecalho = l

      break
    }

  }

  if(json){
    break
  }

}

  // ======================
  // VALIDA ABA
  // ======================

  if(!json){

    alert(`
Não foi possível encontrar uma aba válida no Excel.

O arquivo precisa conter colunas como:
- Pedido
- NF ou Nota Fiscal
- Volume
    `)

    return
  }

  // ======================
  // IDENTIFICA COLUNAS
  // ======================

  const headers = json[linhaCabecalho].map(h =>
    String(h).trim().toLowerCase()
  )

  const colPedido = headers.findIndex(h =>
    h.includes("pedido")
  )

  const colNF = headers.findIndex(h =>
    h.includes("nf") ||
    h.includes("nota")
  )

  const colVolumes = headers.findIndex(h =>
    h.includes("volume")
  )

  // ======================
  // VALIDA COLUNAS
  // ======================

  if(colPedido === -1 || colNF === -1){

    alert(`
Não foi possível identificar automaticamente as colunas:

- Pedido
- NF

Verifique o Excel.
    `)

    return
  }

  mapaPedidos = {}

  // ======================
  // LEITURA DAS LINHAS
  // ======================

  for(let i = linhaCabecalho + 1; i < json.length; i++){

    const row = json[i]

    const pedido = String(row[colPedido] || "").trim()

    const nf = String(row[colNF] || "").trim()

    const volumes = String(
      row[colVolumes] || "1"
    ).trim()

    if(nf && pedido){

      mapaPedidos[nf] = {
        pedido,
        volumes
      }

    }

  }

  alert(`
Excel carregado com sucesso!

Aba encontrada:
${abaEncontrada}

${Object.keys(mapaPedidos).length} pedidos importados.
  `)

}

  reader.readAsArrayBuffer(file)

})

// ======================
// XML
// ======================
document.getElementById("xmlFile").addEventListener("change", async function(e){

  if(Object.keys(mapaPedidos).length === 0){
    alert("Carregue o romaneio Excel antes dos XMLs")
    return
  }

  const files = e.target.files
  lista = []
  const nfsProcessadas = new Set()
const errosImportacao = []

  for(let file of files){

    const xmlText = await file.text()
    const xmlDoc = new DOMParser().parseFromString(xmlText,"text/xml")
    if(xmlDoc.getElementsByTagName("parsererror").length > 0){
   errosImportacao.push(`Arquivo ${file.name} possui XML inválido`)
continue
}

    const nf = xmlDoc.getElementsByTagName("nNF")[0]?.textContent?.trim() || ""
    if(nfsProcessadas.has(nf)){
  errosImportacao.push(`NF ${nf} duplicada`)
  continue
}

nfsProcessadas.add(nf)

    const destNode = xmlDoc.getElementsByTagName("dest")[0]
    const emitNode = xmlDoc.getElementsByTagName("emit")[0]

    const dadosMapa = mapaPedidos[nf]

    if(!dadosMapa){
      errosImportacao.push(`NF ${nf} não encontrada no Excel`)
    continue
    }

    const pedido = dadosMapa.pedido
    const volumes = dadosMapa.volumes || 1

    lista.push({

      nf,
      pedido,
      volumes,

      destNome: destNode?.getElementsByTagName("xNome")[0]?.textContent || "",
      destRua: destNode?.getElementsByTagName("xLgr")[0]?.textContent || "",
      destNumero: destNode?.getElementsByTagName("nro")[0]?.textContent || "",
      destComplemento: destNode?.getElementsByTagName("xCpl")[0]?.textContent || "",
      destCEP: destNode?.getElementsByTagName("CEP")[0]?.textContent ||
               destNode?.getElementsByTagName("cep")[0]?.textContent || "",
      destBairro: destNode?.getElementsByTagName("xBairro")[0]?.textContent || "",
      destCidade: destNode?.getElementsByTagName("xMun")[0]?.textContent || "",
      destUF: destNode?.getElementsByTagName("UF")[0]?.textContent || "",

      emitNome: emitNode?.getElementsByTagName("xNome")[0]?.textContent || "",
      emitRua: emitNode?.getElementsByTagName("xLgr")[0]?.textContent || "",
      emitNumero: emitNode?.getElementsByTagName("nro")[0]?.textContent || "",
      emitComplemento: emitNode?.getElementsByTagName("xCpl")[0]?.textContent || "",

emitBairro: emitNode?.getElementsByTagName("xBairro")[0]?.textContent || "",

emitCidade: emitNode?.getElementsByTagName("xMun")[0]?.textContent || "",

emitUF: emitNode?.getElementsByTagName("UF")[0]?.textContent || "",

emitCEP: emitNode?.getElementsByTagName("CEP")[0]?.textContent ||
         emitNode?.getElementsByTagName("cep")[0]?.textContent || ""

    })

  }

  alert("XMLs carregados!")

})

// ======================
// VALIDAÇÃO
// ======================
function validar(){

  const erros = []

  if(lista.length === 0){
    erros.push("Nenhum XML carregado")
  }

  lista.forEach(p => {

    if(!p.nf) erros.push("NF ausente em algum XML")
    if(!p.pedido) erros.push(`Pedido ausente na NF ${p.nf}`)
    if(!p.volumes) erros.push(`Volumes ausente na NF ${p.nf}`)

  })

  return erros

}

// ======================
// GERAR ETIQUETAS
// ======================
function gerarEtiqueta(){

  const erros = validar()
  const erroBox = document.getElementById("erroBox")

  if(erros.length > 0){
    erroBox.style.display = "block"
    erroBox.innerHTML = "<b>Corrija antes:</b><br><br>" + erros.join("<br>")
    return
  }

  erroBox.style.display = "none"

  const container = document.getElementById("container")
  container.innerHTML = ""

  lista.forEach((p,i)=>{

    const qtd = parseInt(p.volumes) || 1

    for(let v=1; v<=qtd; v++){

      const id = `${p.nf}-${i}-${v}`

      const div = document.createElement("div")
      div.className = "etiqueta"

      div.innerHTML = `
<div class="etiqueta-box">

  <div class="titulo">WESTWING - DS HÍBRIDO</div>

  <div class="linha destaque">
  <div class="campo">NF:</div>
  <div class="valor">${p.nf}</div>
</div>

<div class="linha destaque">
  <div class="campo">Pedido:</div>
  <div class="valor">${p.pedido}</div>
</div>

  <div class="barcode">
    <svg id="b-${id}"></svg>
  </div>

  <div class="secao">

    <div class="linha">
      <div class="campo">Destinatário:</div>
      <div class="valor">${p.destNome}</div>
    </div>

    <div class="linha">
      <div class="campo">Endereço:</div>
      <div class="valor">
        ${p.destRua}, ${p.destNumero}
        ${p.destComplemento ? " - " + p.destComplemento : ""}
      </div>
    </div>

    <div class="linha">
  <div class="campo">Bairro:</div>
  <div class="valor">${p.destBairro}</div>
</div>

    <div class="linha">

  <div class="campo">Cidade:</div>
  <div class="valor">
    ${p.destCidade}/${p.destUF}
  </div>

  <div class="campo">CEP:</div>
  <div class="valor">
    ${p.destCEP || ""}
  </div>

</div>

</div>

  <div class="secao">

    <div class="linha">
      <div class="campo">Remetente:</div>
      <div class="valor">${p.emitNome}</div>
    </div>

    <div class="linha">
      <div class="campo">Endereço:</div>
      <div class="valor">
        ${p.emitRua}, ${p.emitNumero}
        ${p.emitComplemento ? " - " + p.emitComplemento : ""}
      </div>
    </div>

    <div class="linha">
  <div class="campo">Bairro:</div>
  <div class="valor">${p.emitBairro}</div>
</div>

    <div class="linha">

  <div class="campo">Cidade:</div>

  <div class="valor">
    ${p.emitCidade}/${p.emitUF}
  </div>

  <div class="campo">CEP:</div>

  <div class="valor">
    ${p.emitCEP || ""}
  </div>

</div>

    <div class="linha volume">
      <div class="campo">Volume:</div>
      <div class="valor">${v}/${qtd}</div>
    </div>

  </div>

</div>
`

      container.appendChild(div)

      JsBarcode(`#b-${id}`, String(p.pedido), {
        format:"CODE128",
        width:2,
        height:60,
        displayValue:false
      })

    }

  })

}

</script>

</body>
</html>
